[package]
name = "vidmanager"
version = "0.1.0"
description = "VidManager - gerenciador de downloads de video"
authors = ["VidManager"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "vidmanager_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-notification = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
axum = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
anyhow = "1"
rfd = "0.15"
arboard = "3"
zip = { version = "2", default-features = false, features = ["deflate"] }
dirs = "5"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
